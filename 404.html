<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Страница не найдена (ошибка 404) — О.А.З.И.С</title>
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/404.css">
</head>
<body>
    <main class="error-page">
        <section class="error-card" aria-labelledby="error-title">
            <a class="brand" href="/" aria-label="О.А.З.И.С — главная страница">
                <img src="resource/resource/logo.png" alt="О.А.З.И.С">
            </a>

            <p class="error-code">404</p>
            <h1 id="error-title">Кажется, страница забыла, о чем хотела сказать</h1>
            <p class="error-message">
                Возможно, адрес указан с ошибкой или страница была перемещена.
            </p>

            <a class="home-button" href="/">Вернуться на главную</a>
            <p class="error-note">О.А.З.И.С — селекция и семеноводство</p>
        </section>
    </main>
</body>
</html>
