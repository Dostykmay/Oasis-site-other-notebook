<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Авторские свидетельства и патент О.А.З.И.С">

    <title>О.А.З.И.С — Авторские свидетельства и патенты</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/certificate.css">

    <script src="js/include.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="certificate-main-block">
            <img
                class="certificate-main-block-logo"
                src="resource/resource/logo.png"
                alt="Логотип О.А.З.И.С"
                decoding="async">

            <div class="certificate-main-block-intro">
                <h1>Наши свидетельства и патенты</h1>

                <p>
                    Документы, подтверждающие результаты селекционной работы
                    О.А.З.И.С, авторство разработок и права на созданные гибриды.
                </p>
            </div>

            <!-- ========================================== -->
            <!-- ПАТЕНТЫ                                    -->
            <!-- ========================================== -->

            <section class="certificate-category" aria-labelledby="patents-title">
                <h2 class="certificate-category-title" id="patents-title">
                    Патенты
                </h2>

                <div class="certificate-main-block-first certificate-grid-patents">
                    <article class="certificate-card">
                        <div class="img-c">
                            <img
                                src="resource/Sertificate_page/патентНаАполло-converted.webp"
                                alt="Патент на гибрид Аполло"
                                loading="lazy"
                                decoding="async">
                        </div>
                    </article>
                </div>
            </section>

            <!-- ========================================== -->
            <!-- АВТОРСКИЕ ПРАВА                            -->
            <!-- ========================================== -->

            <section
                class="certificate-category"
                aria-labelledby="copyright-title">

                <h2 class="certificate-category-title" id="copyright-title">
                    Авторские права
                </h2>

                <div class="certificate-main-block-first certificate-grid-rights">

                    <article class="certificate-card">
                        <div class="img-c">
                            <img
                                src="resource/Sertificate_page/свидетельство_АИ-converted.webp"
                                alt="Авторское свидетельство О.А.З.И.С Курьянова А.И"
                                loading="lazy"
                                decoding="async">
                        </div>

                    </article>


                      <article class="certificate-card">
                        <div class="img-c">
                            <img
                                src="resource/Sertificate_page/свидетельство_Пушкарева-converted.webp"
                                alt="Авторское свидетельство О.А.З.И.С Пушкарёвой В.И"
                                loading="lazy"
                                decoding="async">
                        </div>

                    </article>
                </div>
            </section>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
