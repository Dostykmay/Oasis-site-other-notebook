    <meta property="og:description" content="Селекционно-семеноводческая компания. Собственная селекция, производство, земля и техника.">
    <meta property="og:url" content="https://oasis-seeds.su/">

    <title>О.А.З.И.С — селекция и семеноводство</title>

    >

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="canonical" href="https://oasis-seeds.su">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">


    <!-- defer говорит что скрипт можно запускать в фоновом режиме, а не ждать его загрузки -->
    <script src="js/include.js" defer></script>
    <script src="js/cookie.js" defer></script>

    <style>
        .footer{
            background: linear-gradient(
                180deg,
                rgb(73, 77, 78) 0%,
                rgb(194, 70, 8)
            );
        }
    </style>

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://oasis-seeds.su/#organization",
    "name": "О.А.З.И.С",
    "url": "https://oasis-seeds.su/",
    "logo": "https://oasis-seeds.su/resource/resource/logo.png",
    "email": "info@oasis-seeds.su",
    "telephone": "+74732602310",
    "address": {
        "@type": "PostalAddress",
        "streetAddress": "ул. Карла Маркса, 114",
        "addressLocality": "Воронеж",
        "addressRegion": "Воронежская область",
        "postalCode": "394036",
        "addressCountry": "RU"
    }
    }

</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <!-- ============================================== -->
        <!-- ГЛАВНЫЙ БЛОК                                  -->
        <!-- ============================================== -->
        <section class="index-main-block">
            <img
                class="index-main-block-fon"
                src="resource/resource/pole/pole2-converted.webp"
                alt="Маскот О.А.З.И.С">

            <img
                class="index-main-block-logo"
                src="resource/resource/logo.png"
                alt="Логотип О.А.З.И.С">

            <div class="index-main-block-text">
                <h1>О.А.З.И.С</h1>
                <p>Органическое адаптивное земледелие и семеноводство</p>
            </div>
            <div class="index-main-block-partners">
                <img
                    src="resource/resource/logo/Лого-no-bg-preview (carve.photos).webp"
                    alt="Логотип Сделано в Воронеже"
                    loading="lazy"
                    decoding="async">

                <img
                    src="resource/resource/logo/logo2-converted.webp"
                    alt="Логотип Сделано в России"
                    loading="lazy"
                    decoding="async">

                <img
                    src="resource/resource/logo/logo3-converted.webp"
                    alt="Логотип Воронежское качество"
                    loading="lazy"
                    decoding="async">

                <img
                    src="resource/resource/logo/iso-9001-2015 2.webp"
                    alt="Логотип ISO"
                    loading="lazy"
                    decoding="async">
            </div>
        </section>

        <!-- ============================================== -->
        <!-- БЛОК О КОМПАНИИ                               -->
        <!-- ============================================== -->
        <section class="index-essence-company">
            <p>
                О.А.З.И.С — это не просто селекционно-семеноводческая компания.
                У нас своя земля и техника, своя селекция, свое производство.
                Мы растим с душой, работаем с идеями, движемся к новым горизонтам
                и свершениям.
            </p>

            <img
                src="resource/resource/dragon1.webp"
                alt="Маскот О.А.З.И.С">
        </section>
