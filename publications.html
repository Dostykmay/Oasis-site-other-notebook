<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Публикации, статьи и материалы О.А.З.И.С">

    <title>О.А.З.И.С — Наши публикации</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/publications.css">

    <script src="js/include.js" defer></script>

    <style>
        .footer{
            background: linear-gradient(
                180deg,
                #180f07 0%,
                rgb(184, 93, 18) 100%
            );
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <!-- ============================================== -->
        <!-- HERO                                          -->
        <!-- ============================================== -->

        <section
            class="publications-hero"
            aria-labelledby="publications-title">

            <div class="publications-hero-content">
                <p class="publications-hero-label">
                    О.А.З.И.С · Исследования и практика
                </p>

                <h1 id="publications-title">Наши публикации</h1>

                <p class="publications-hero-description">
                    Статьи, материалы и результаты работы нашей команды
                    в области селекции, семеноводства и растениеводства.
                </p>
            </div>

            <div class="publications-hero-image">
                <img
                    src="resource/Publication_page/публикация_-converted.webp"
                    alt="Работа с материалами и исследованиями О.А.З.И.С"
                    fetchpriority="high"
                    decoding="async">
            </div>
        </section>

        <!-- ============================================== -->
        <!-- ПУБЛИКАЦИИ                                    -->
        <!-- ============================================== -->

       
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
