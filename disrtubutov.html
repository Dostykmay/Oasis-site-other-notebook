<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Дистрибьюторы компании О.А.З.И.С">

    <title>О.А.З.И.С — Дистрибьюторы</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/partners.css">

    <script src="js/include.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <!-- ============================================== -->
        <!-- ПЕРВЫЙ БЛОК                                    -->
        <!-- ============================================== -->
        <section class="partners-main-block">
            <div class="partners-main-block-text">
                <h1>Для кого мы производим?</h1>

                <p>
                    Компании, которые ценят нас
                </p>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- СПИСОК ДИСТРИБЬЮТОРОВ                          -->
        <!-- ============================================== -->
        <section class="partners-grid-block">
            <div class="partners-category">
                

                <div class="partners-grid">
                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/чистое-поле.webp"
                                alt="Логотип Чистое поле"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">ЧИСТОЕ ПОЛЕ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/эксперт-агро-converted.webp"
                                alt="Логотип Эксперт Агро"
                                loading="lazy"
                                decoding="async">
                        </div>
                        <p class="partner-card-name">ЭКСПЕРТ АГРО</p>
                    </div>    

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/агроэксперт-converted.webp"
                                alt="Логотип АГРОЭКСПЕРТ"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">АГРОЭКСПЕРТ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/евроселекция-converted.webp"
                                alt="Логотип Евро-Селекция"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">ЕВРОСЕЛЕКЦИЯ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/агромаркет-converted.webp"
                                alt="Логотип Агромаркет"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">АГРОМАРКЕТ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/агроколос-converted.webp"
                                alt="Логотип Агроколос"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">АГРОКОЛОС</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/агротехнологии-converted.webp"
                                alt="Логотип агротехнологии"
                                loading="lazy"
                                decoding="async">
                        </div>
                        <p class="partner-card-name">АГРОТЕХНОЛОГИЯ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/агропартнер-converted.webp"
                                alt="Логотип агропартнер"
                                loading="lazy"
                                decoding="async">
                        </div>
                        <p class="partner-card-name">АГРО ПАРТНЕР</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
