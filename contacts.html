<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Описание сайта O.A.S.I.S"> 
    <title>O.A.S.I.S - корпоративный сайт</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/contacts.css">
    <script src="js/include.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="contacts-main">
            <img src="resourcesContacts/map_fon.avif" alt="карта_фон">
            <div class="contacts-main-text">
                <h1>Контакты "О.А.З.И.С"</h1>
            </div>
        </section>

        <section class="contacts-info">
            <div class="contacts-info-container">
                <h2>Центральный офис</h2>
                <div class="contacts-info-container-text">
                    <div class="concret-block">
                        <h2>
                            Адрес
                        </h2>
                        <p>394036 Воронеж, ул. Карла Маркса 114</p>
                    </div>
                    <div class="concret-block">
                        <h2>
                            E-mail
                        </h2>
                        <p>info@oasis-seeds.su</p>
                    </div>
                    <div class="concret-block">
                        <h2>
                            Телефон
                        </h2>
                        <p>+7 (473) 260-23-10</p>
                    </div>
                </div>
            </div>
        </section>

       <section class="contacts-map-block">
            <!-- Карта с адресом ул. Карла Маркса, 114, Воронеж -->
            <!-- iframe позволяет загружать др документы в текущий -->
            <div style="position:relative;overflow:hidden;">
                <iframe 
                    src="https://yandex.ru/map-widget/v1/?ll=39.200000%2C51.670000&mode=search&text=%D0%92%D0%BE%D1%80%D0%BE%D0%BD%D0%B5%D0%B6%2C%20%D1%83%D0%BB.%20%D0%9A%D0%B0%D1%80%D0%BB%D0%B0%20%D0%9C%D0%B0%D1%80%D0%BA%D1%81%D0%B0%2C%20114&z=18" 
                    width="100%" 
                    height="500px" 
                    frameborder="1" 
                    allowfullscreen="true" 
                    style="position:relative;">
                </iframe>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
